name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test.sh
      - run: bash scripts/build.sh
      - run: bash scripts/dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AgentMemoryBar-preview
          path: |
            build/*.dmg
            build/SHA256SUMS
